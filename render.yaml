services:
  - type: web
    name: tut-bus-backend
    runtime: node
    plan: free
    rootDir: tut-bus-app/backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && (npx ts-node prisma/seed.ts || true) && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tut-bus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://panda712s.github.io"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: tut-bus-db
    plan: free
