name: tut_bus_app
description: TUT Bus App - Smart Campus Bus Tracking and Management System (student & driver app)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.2

  # Local storage (auth tokens, cached profile)
  shared_preferences: ^2.3.2

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  intl: any # pinned by flutter_localizations
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
